services:
  journey-unfinished:
    build:
      context: .
    image: journey-unfinished:latest
    container_name: journey-unfinished
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_DATABASE_PATH: /app/data/journey-unfinished.sqlite
      NUXT_UPLOAD_DIR: /app/data/uploads
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:?required}
      NUXT_DISCORD_CLIENT_ID: ${NUXT_DISCORD_CLIENT_ID:?required}
      NUXT_DISCORD_CLIENT_SECRET: ${NUXT_DISCORD_CLIENT_SECRET:?required}
      NUXT_DISCORD_REDIRECT_URI: ${NUXT_DISCORD_REDIRECT_URI:?required}
      NUXT_ADMIN_DISCORD_IDS: ${NUXT_ADMIN_DISCORD_IDS:-}
      NUXT_SESSION_DAYS: ${NUXT_SESSION_DAYS:-30}
    volumes:
      - journey-unfinished-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  journey-unfinished-data:
